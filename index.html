</style></head><body><div class="shell"><aside><div class="brand"><i>✳</i> margen</div><div><div class="ey">Mi cuaderno</div><nav aria-label="Navegación principal"></nav></div><small class="sidefoot">Cuaderno universitario<br>Edición personal · 01</small></aside><main class="wrap"><div class="top"><span class="ey" id="stamp"></span><div class="buttons"><button id="theme" class="mini"></button><button class="primary" data-act="task">+ Nueva tarea</button></div></div><section class="hero"><span class="ey" id="chapter"></span><h1 id="title"></h1><p id="desc"></p><svg aria-hidden="true" viewBox="0 0 260 170"><defs><pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M14 0H0V14" fill="none" stroke="#9d6277" opacity=".25"/></pattern></defs><rect width="260" height="170" fill="url(#grid)"/><g id="flower" fill="none" stroke="#813857" stroke-width="1.2"></g></svg></section><div id="view"></div><footer>Margen · Tus datos se guardan en este navegador.</footer></main></div><dialog id="modal" aria-labelledby="mt"><form id="form"><h2 id="mt"></h2><div id="fields"></div><p id="error" class="err" role="alert"></p><div class="buttons"><button type="button" id="cancel">Cancelar</button><button class="primary">Guardar</button></div></form></dialog>

const sections=['Inicio','Materias y horario','Tareas y proyectos','Calendario','Apuntes','Estudio'],titles=['Mi <em>agenda.</em>','Mi <em>semana.</em>','Mis <em>pendientes.</em>','Mi <em>calendario.</em>','Mis <em>apuntes.</em>','Tiempo de <em>estudio.</em>'],subs=['Un vistazo a tus clases, pendientes y próximas entregas.','Tus materias, aulas y horarios en un mismo lugar.','Divide tus proyectos en pasos y decide por dónde empezar.','Clases, entregas y eventos en el mismo mes.','Guarda ideas y encuentra lo que necesitas para repasar.','Elige una tarea y reserva un momento para concentrarte.'];
let page=0,selected=today(),month=date(selected),filters={state:'all',sub:'',priority:''},query='',onSave;
const subject=id=>data.subjects.find(s=>s.id===id),subName=id=>subject(id)?.name||'Sin materia',byId=(k,id)=>data[k].find(i=>i.id===id),sorted=a=>[...a].sort((x,y)=>x.date.localeCompare(y.date)||Number(y.priority==='Alta')-Number(x.priority==='Alta'));
const btn=(label,act,id='',css='mini')=>'<button type="button" class="'+css+'" data-act="'+act+'" data-id="'+esc(id)+'">'+label+'</button>',card=(k,t,body,css='')=>'<section class="card '+css+'"><div class="ey">'+k+'</div><h2>'+t+'</h2>'+body+'</section>',empty=(t,b='')=>'<div class="empty"><p>'+t+'</p>'+b+'</div>',item=(t,d,b='')=>'<div class="item"><strong>'+t+'</strong><small>'+d+'</small><div class="buttons">'+b+'</div></div>',opt=(v,t,sel)=>'<option value="'+esc(v)+'" '+(String(v)===String(sel)?'selected':'')+'>'+esc(t)+'</option>',subjectOpts=(id,all='Sin materia')=>opt('',all,id)+data.subjects.map(s=>opt(s.id,s.name,id)).join('');

const sel=(n,l,options)=>'<label class="f">'+l+'<select name="'+n+'">'+options+'</select></label>',area=(n,l,v='',attrs='')=>'<label class="f">'+l+'<textarea name="'+n+'" '+attrs+'>'+esc(v)+'</textarea></label>';
function openForm(t,html,fn){$('mt').textContent=t;$('fields').innerHTML=html;$('error').textContent='';onSave=fn;$('modal').showModal();$('fields').querySelector('input,select,textarea')?.focus()}
$('cancel').onclick=()=>$('modal').close();$('form').onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));for(const k in x)x[k]=x[k].trim();if([...e.target.querySelectorAll('[required]')].some(a=>!String(a.value).trim())){$('error').textContent='Completa los campos obligatorios.';return}const err=onSave(x);if(err){$('error').textContent=err;return}save();$('modal').close();render()};
function upsert(k,id,x){const r=byId(k,id);if(r)Object.assign(r,x);else data[k].push({id:uid(),...x})}
function taskForm(id){const t=byId('tasks',id)||{};openForm(t.id?'Editar pendiente':'Nuevo pendiente',field('title','Título','text',t.title,'required maxlength="120"')+sel('kind','Tipo',['Tarea','Proyecto'].map(v=>opt(v,v,t.kind)).join(''))+sel('sub','Materia (opcional)',subjectOpts(t.sub))+field('date','Fecha de entrega','date',t.date||(page===3?selected:today()),'required')+sel('priority','Prioridad',['Media','Alta','Baja'].map(v=>opt(v,v,t.priority)).join(''))+area('steps','Subtareas · una por línea',(t.steps||[]).map(s=>s.title).join('\n'),'maxlength="2400"'),x=>{const old=[...(t.steps||[])];const steps=x.steps.split('\n').map(v=>v.trim()).filter(Boolean).map(title=>{const i=old.findIndex(s=>s.title===title);return i<0?{title,done:false}:old.splice(i,1)[0]});upsert('tasks',id,{...x,steps,done:t.done||false})})}
function taskRow(t){return '<div class="item"><div class="line"><label class="tick"><input type="checkbox" data-check="'+t.id+'" '+(t.done?'checked':'')+'><span><strong class="'+(t.done?'completed':'')+'">'+esc(t.title)+'</strong><small>'+esc(subName(t.sub))+' · '+fmt(t.date)+' · '+t.priority+' · '+t.kind+'</small></span></label><div class="buttons">'+btn('Editar','task',t.id)+(page===2?btn('Eliminar','del-tasks',t.id):'')+'</div></div>'+(t.steps.length?'<details><summary>'+t.steps.filter(s=>s.done).length+'/'+t.steps.length+' pasos completos</summary>'+t.steps.map((s,i)=>'<label class="tick"><input type="checkbox" data-step="'+t.id+'" data-index="'+i+'" '+(s.done?'checked':'')+'>'+esc(s.title)+'</label>').join('')+'</details>':'')+'</div>'}

function home(){const now=today(),w=date(now);w.setDate(w.getDate()-weekday(now));let strip='';for(let i=0;i<7;i++){let s=local(w);strip+=btn(days[i]+'<b>'+w.getDate()+'</b>','day',s,s===now?'today':'');w.setDate(w.getDate()+1)}const pending=sorted(data.tasks.filter(t=>!t.done)),next=pending.find(t=>t.date>=now),classes=classesOn(now);return '<div class="week" aria-label="Elegir un día de esta semana">'+strip+'</div><div class="cols"><div>'+card('01 / Planeación','Mis pendientes',pending.length?pending.slice(0,5).map(taskRow).join('')+btn('Ver todos','goto','2'):empty('Todo despejado. Aquí aparecerán tus tareas y proyectos.',btn('Crea tu primera tarea','task')))+card('02 / Hoy','Clases de hoy',classes.length?classes.map(classRow).join(''):empty('Hoy no tienes clases registradas.',btn('Organizar mi horario','goto','1')))+'</div><div>'+card('03 / En el radar','Próxima entrega',next?item(esc(next.title),fmt(next.date)+' · '+esc(subName(next.sub))):'<p>Al registrar una entrega con fecha, aparecerá aquí.</p>','sage')+card('04 / Primer paso',data.subjects.length?'Mis materias':'Abre tu cuaderno',data.subjects.length?'<p>'+data.subjects.length+' materia(s) en tu cuaderno.</p>'+btn('Ver materias','goto','1'):'<p>Agrega tu primera materia y elige un color para reconocerla durante la semana.</p>'+btn('＋ Agregar materia','subject'))+'</div></div>'}
function subjectForm(id){const s=subject(id)||{};openForm('Materia',field('name','Nombre','text',s.name,'required maxlength="70"')+field('color','Color','color',s.color||'#974866'),x=>{if(data.subjects.some(s=>s.id!==id&&s.name.toLowerCase()===x.name.toLowerCase()))return 'Esta materia ya existe.';upsert('subjects',id,x)})}
function classForm(id){if(!data.subjects.length){subjectForm();return}const c=byId('classes',id)||{};openForm('Horario de clase',sel('sub','Materia',data.subjects.map(s=>opt(s.id,s.name,c.sub)).join(''))+sel('day','Día',days.map((v,i)=>opt(i,v,c.day)).join(''))+'<div class="formrow">'+field('start','Inicio','time',c.start,'required')+field('end','Fin','time',c.end,'required')+'</div>'+field('room','Aula (opcional)','text',c.room,'maxlength="70"'),x=>{if(x.end<=x.start)return 'La clase debe terminar después de su inicio.';if(data.classes.some(r=>r.id!==id&&r.day===x.day&&r.start<x.end&&x.start<r.end))return 'Ya tienes clase en este horario.';upsert('classes',id,x)})}
function subjects(){return '<div class="cols">'+card('01 / Cursos','Materias',btn('+ Agregar materia','subject')+(data.subjects.map(s=>item('<span class="color" style="background:'+s.color+'"></span>'+esc(s.name),'',btn('Editar','subject',s.id)+btn('Eliminar','del-subjects',s.id))).join('')||empty('Tus materias aparecerán aquí.')))+card('02 / Semana','Horario semanal',btn(data.subjects.length?'+ Agregar clase':'Agregar primera materia',data.subjects.length?'class':'subject')+(data.classes.length?days.map((d,i)=>{const a=data.classes.filter(c=>+c.day===i).sort((a,b)=>a.start.localeCompare(b.start));return a.length?'<h3>'+d+'</h3>'+a.map(classRow).join(''):''}).join(''):empty('Registra tus clases para ver tu semana.')))+'</div>'}
function tasks(){const list=sorted(data.tasks.filter(t=>(filters.state==='all'||t.done===(filters.state==='done'))&&(!filters.sub||t.sub===filters.sub)&&(!filters.priority||t.priority===filters.priority)));return card('01 / Pendientes','Tareas y proyectos','<div class="filters">'+sel('state','Estado',[['all','Todas'],['open','Pendientes'],['done','Completadas']].map(([v,t])=>opt(v,t,filters.state)).join(''))+sel('sub','Materia',subjectOpts(filters.sub,'Todas'))+sel('priority','Prioridad',opt('','Todas',filters.priority)+['Alta','Media','Baja'].map(v=>opt(v,v,filters.priority)).join(''))+'</div>'+(list.map(taskRow).join('')||empty('No hay pendientes en esta vista.',btn('Crear tarea','task'))))}
function eventForm(id){const ev=byId('events',id)||{};openForm('Evento del calendario',field('name','Título','text',ev.name,'required maxlength="120"')+sel('kind','Tipo',['Evento personal','Examen'].map(v=>opt(v,v,ev.kind)).join(''))+field('date','Fecha','date',ev.date||selected,'required')+field('time','Hora (opcional)','time',ev.time)+sel('sub','Materia (opcional)',subjectOpts(ev.sub)),x=>{upsert('events',id,x);selected=x.date;month=date(selected)})}
function calendar(){const first=new Date(month.getFullYear(),month.getMonth(),1,12),last=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();let grid=days.map(d=>'<span class="ey">'+d+'</span>').join('')+'<span></span>'.repeat(weekday(local(first)));for(let i=1;i<=last;i++){const s=local(new Date(month.getFullYear(),month.getMonth(),i,12)),n=classesOn(s).length+data.tasks.filter(t=>t.date===s).length+data.events.filter(t=>t.date===s).length;grid+=btn(i+(n?'<small>'+n+' act.</small>':''),'day',s,'day '+(s===selected?'selected ':'')+(s===today()?'today':''))}
let ls=classesOn(selected).map(classRow).join('')+sorted(data.tasks.filter(t=>t.date===selected)).map(taskRow).join('')+data.events.filter(e=>e.date===selected).sort((a,b)=>a.time.localeCompare(b.time)).map(e=>item(esc(e.name),esc([e.kind,e.time,subject(e.sub)?.name].filter(Boolean).join(' · ')),btn('Editar','event',e.id)+btn('Eliminar','del-events',e.id))).join('');
return '<div class="cols">'+card('01 / Vista mensual',fmt(local(first),{month:'long',year:'numeric'}),'<header class="buttons">'+btn('← Anterior','month','-1')+btn('Hoy','day',today())+btn('Siguiente →','month','1')+'</header><div class="cal">'+grid+'</div>')+card('02 / Actividades',fmt(selected,{weekday:'long',day:'numeric',month:'short'}),'<div class="buttons">'+btn('+ Evento o examen','event')+btn('+ Tarea','task')+'</div>'+(ls||empty('Este día está libre.')))+'</div>'}
function noteForm(id){const n=byId('notes',id)||{};openForm('Apunte',field('title','Título','text',n.title,'required maxlength="120"')+sel('sub','Materia (opcional)',subjectOpts(n.sub))+area('body','Contenido',n.body,'required maxlength="15000"'),x=>upsert('notes',id,{...x,pinned:n.pinned||false}))}
function noteList(){const q=query.trim().toLocaleLowerCase();return [...data.notes].filter(n=>(n.title+' '+subName(n.sub)).toLocaleLowerCase().includes(q)).sort((a,b)=>Number(b.pinned)-Number(a.pinned)).map(n=>'<article class="item"><strong>'+ (n.pinned?'★ ':'')+esc(n.title)+'</strong><small>'+esc(subName(n.sub))+'</small><p>'+esc(n.body)+'</p><div class="buttons">'+btn(n.pinned?'Desfijar':'Fijar','pin',n.id)+btn('Editar','note',n.id)+btn('Eliminar','del-notes',n.id)+'</div></article>').join('')||empty(q?'No hay apuntes con ese título o materia.':'Guarda tu primer apunte para empezar.') }
function notes(){return card('01 / Cuaderno','Mis apuntes',btn('+ Nuevo apunte','note')+field('search','Buscar por título o materia','search',query,'id="search"')+'<div id="noteslist">'+noteList()+'</div>')}
function remaining(){const t=data.timer;return t.end?Math.max(0,Math.ceil((t.end-Date.now())/1000)):t.left}
function tick(){const t=data.timer;let left=remaining();if(t.end&&!left){t.end=0;t.left=0;save()}if(!$('clock'))return;$('clock').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');$('clockState').textContent=t.end?'En curso':left?'En pausa':'Sesión terminada';$('play').textContent=t.end?'Pausar':left?'Iniciar / continuar':'Repetir sesión'}
function study(){const t=data.timer;return '<div class="cols">'+card('01 / Concentración',t.mode==='work'?'Sesión de estudio':'Descanso','<div class="buttons">'+btn('Estudio','mode','work')+btn('Descanso','mode','rest')+'</div><div class="clock" id="clock"></div><p id="clockState"></p><div class="buttons"><button id="play" class="primary" data-act="play">Iniciar</button>'+btn('Reiniciar','reset')+'</div>','sage')+card('02 / Preparación','Mi sesión',sel('focus','Tarea de esta sesión',opt('','Estudio libre',t.task)+data.tasks.filter(r=>!r.done).map(r=>opt(r.id,r.title,t.task)).join(''))+'<p class="mut">Estudio: '+t.work+' min · Descanso: '+t.rest+' min</p>'+btn('Ajustar duración','duration'))+'</div>'+sessionPlanner()}
function sessionPlanner(){
  const {work, rest} = data.timer;
  return card('03 / Planeación', '¿Cuánto alcanzo a estudiar?',
    '<p>Escribe cuántos minutos tienes libres. Cada bloque dura '+work+' min y entre bloques hay '+rest+' min de descanso.</p>'+
    '<form id="session-plan">'+field('minutes','Tiempo disponible (minutos)','number','', 'required min="1" max="1440" step="1" placeholder="Ej. 90"')+
    '<button class="primary" type="submit">Calcular mi plan</button></form>'+
    '<p id="plan-result" aria-live="polite"></p>');
}
function calculatePlan(minutes, work, rest){
  const blocks = Math.floor((minutes + rest) / (work + rest));
  if (!blocks) return 'Puedes hacer una sesión corta de '+minutes+' min. Para un bloque completo necesitas '+work+' min.';
  const studyTime = blocks * work;
  const breaks = (blocks - 1) * rest;
  return blocks+' '+(blocks === 1 ? 'bloque' : 'bloques')+' · '+studyTime+' min de estudio · '+breaks+' min de descanso. Tiempo libre al final: '+(minutes-studyTime-breaks)+' min.';
}
document.addEventListener('submit', event => {
  if (event.target.id !== 'session-plan') return;
  event.preventDefault();
  const minutes = Number(event.target.elements.minutes.value);
  $('plan-result').textContent = calculatePlan(minutes, data.timer.work, data.timer.rest);
});
function duration(){const t=data.timer;openForm('Duración de las sesiones',field('work','Estudio (minutos)','number',t.work,'required min="1" max="180"')+field('rest','Descanso (minutos)','number',t.rest,'required min="1" max="60"'),x=>{t.work=+x.work;t.rest=+x.rest;t.end=0;t.left=t[t.mode]*60})}
function render(){document.body.classList.toggle('dark',data.dark);$('theme').textContent=data.dark?'☀ Modo claro':'☾ Modo oscuro';$('theme').setAttribute('aria-pressed',data.dark);document.querySelector('nav').innerHTML=sections.map((n,i)=>'<button data-act="goto" data-id="'+i+'" '+(i===page?'aria-current="page"':'')+'><span aria-hidden="true">'+['⌂','▤','☑','▦','✎','◷'][i]+'</span>'+n+'</button>').join('');$('stamp').textContent=fmt(today(),{weekday:'long',day:'numeric',month:'long'});$('chapter').textContent='Cuaderno universitario / 0'+(page+1);$('title').innerHTML=titles[page];$('desc').textContent=subs[page];$('view').innerHTML=[home,subjects,tasks,calendar,notes,study][page]();if(page===5)tick()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,t=data.timer;if(['task','class','subject','note','event','duration'].includes(a)){({task:taskForm,class:classForm,subject:subjectForm,note:noteForm,event:eventForm,duration})[a](id);return}
if(a==='goto')page=+id;if(a==='day'){page=3;selected=id;month=date(id)}if(a==='month')month=new Date(month.getFullYear(),month.getMonth()+Number(id),1,12);if(a==='pin'){const n=byId('notes',id);n.pinned=!n.pinned}if(a.startsWith('del-')){const k=a.slice(4);if(!confirm(k==='subjects'?'¿Eliminar esta materia y sus clases? Tus tareas, eventos y apuntes se conservarán sin materia.':'¿Eliminar este registro?'))return;data[k]=data[k].filter(r=>r.id!==id);if(k==='subjects'){data.classes=data.classes.filter(c=>c.sub!==id);for(const r of [...data.tasks,...data.events,...data.notes])if(r.sub===id)r.sub='';if(filters.sub===id)filters.sub=''}if(k==='tasks'&&t.task===id)t.task=''}if(a==='mode'||a==='reset'){if(a==='mode')t.mode=id;t.end=0;t.left=t[t.mode]*60}if(a==='play'){if(t.end){t.left=remaining();t.end=0}else{t.left=t.left||t[t.mode]*60;t.end=Date.now()+t.left*1000}}save();render();if(a==='goto')window.scrollTo(0,0)});
document.addEventListener('change',e=>{const b=e.target;if(b.dataset.check){byId('tasks',b.dataset.check).done=b.checked;if(b.checked&&data.timer.task===b.dataset.check)data.timer.task=''}else if(b.dataset.step)byId('tasks',b.dataset.step).steps[+b.dataset.index].done=b.checked;else if(b.closest('.filters'))filters[b.name]=b.value;else if(b.name==='focus')data.timer.task=b.value;else return;save();render()});document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;$('noteslist').innerHTML=noteList()}});$('theme').onclick=()=>{data.dark=!data.dark;save();render()};
$('flower').innerHTML=Array.from({length:20},(_,i)=>'<ellipse cx="133" cy="55" rx="16" ry="37" transform="rotate('+i*18+' 133 85)"/>').join('');render();setInterval(tick,500);
</script></body></html>
